*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--pattern),var(--bg);color:var(--text);transition:background-color .3s,color .3s;overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 35%,var(--purple-l),var(--purple-d) 70%);color:#fff;transition:opacity .6s,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash img{width:118px;height:118px;border-radius:28px;box-shadow:0 18px 40px rgba(0,0,0,.25);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
#splash h1{margin:6px 0 0;font-family:'Cairo',sans-serif;font-weight:700;font-size:44px;line-height:1.2;animation:rise .7s .2s both}
#splash .en{letter-spacing:.32em;font-size:13px;opacity:.8;animation:rise .7s .3s both}
#splash .tag{font-size:15px;color:var(--orange-l);animation:rise .7s .4s both}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

/* Layout */
.app{max-width:680px;margin:0 auto;min-height:100%;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:20;display:flex;align-items:center;gap:10px;margin:calc(8px + env(safe-area-inset-top)) 10px 0;padding:7px 10px;background:var(--surface);border-radius:24px;box-shadow:0 2px 30px rgba(90,38,144,.16);border:1px solid var(--line)}
body.sec .topbar{display:none}
body.sec main{padding-top:calc(8px + env(safe-area-inset-top))}
.topbar img{width:42px;height:42px;border-radius:13px}
.brand{display:flex;flex-direction:column;line-height:1.25;gap:1px}
.brand b{font-family:'Cairo',sans-serif;font-weight:700;font-size:19px;color:var(--purple)}
[data-theme="dark"] .brand b{color:#D9B8F5}
.brand small{font-size:10.5px;color:var(--muted);letter-spacing:.18em}
.topbar .sp{flex:1}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--purple)}
[data-theme="dark"] .icon-btn{color:#D9B8F5}
main{padding:16px}
.view{display:none;animation:fade .35s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.hero-word{display:block;width:min(50%,220px);height:auto;margin:2px auto 6px;transform:translateX(-7%);filter:drop-shadow(0 2px 6px rgba(90,38,144,.18))}
.hero .day{font-size:14px;font-weight:800;color:#4A1C78;margin-bottom:5px}
.dates{display:flex;justify-content:center}
.dates .chip{max-width:100%;white-space:nowrap;overflow:hidden}
.dates .sep{opacity:.45;margin:0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(255,247,238,.88);color:#4A1C78;font-size:13px;font-weight:700}
.overall{display:flex;align-items:center;gap:16px;margin-top:12px;background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-2)}
.ring .bar{stroke:url(#gOr);transition:stroke-dashoffset .6s ease}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:19px;color:var(--orange)}
.overall h3{margin:0 0 4px;font-size:16px}
.overall p{margin:0;color:var(--muted);font-size:13.5px}
.now-hint{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 10px;border-radius:999px;background:var(--soft-or);color:#B85A10;font-size:12.5px;font-weight:700}
[data-theme="dark"] .now-hint{background:rgba(242,138,50,.15);color:var(--orange-l)}
.sec-title{margin:16px 4px 8px;font-size:15px;color:var(--muted);font-weight:700}
.sec-cards{display:grid;gap:8px}
.sec-card{display:flex;align-items:center;gap:10px;text-align:right;width:100%;padding:9px 12px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);transition:transform .15s;border:1px solid var(--line)}
.sec-card:active{transform:scale(.98)}
.sec-card .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff}
.sec-card .ic svg{width:21px;height:21px}
.ic.morning{background:linear-gradient(135deg,#FFB066,#F28A32)}
.ic.evening{background:linear-gradient(135deg,#8A4BC4,#5A2690)}
.ic.sleep{background:linear-gradient(135deg,#3B2D57,#1D1726)}
.sec-card .body{flex:1;min-width:0}
.sec-card h4{margin:0;font-size:15px;line-height:1.4;white-space:nowrap}
.sec-card small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.mini{height:5px;border-radius:9px;background:var(--surface-2);margin-top:4px;overflow:hidden}
.mini i{display:block;height:100%;width:0;border-radius:9px;background:var(--grad-or);transition:width .5s}
.sec-card .pct{font-weight:800;color:var(--orange);font-size:14px;min-width:42px;text-align:left}
.sec-card.done .pct::after{content:" ✓"}
.quote{margin-top:12px;padding:12px 12px;text-align:center;border-radius:22px;background:var(--soft-or);border:1px solid rgba(242,138,50,.25);position:relative}
[data-theme="dark"] .quote{background:rgba(242,138,50,.09)}
.quote .lbl{font-size:12px;font-weight:800;color:var(--orange)}
.quote p{font-family:'Cairo',sans-serif;font-weight:700;font-size:17px;line-height:1.8;margin:4px 0;white-space:nowrap}
.quote p.wrap{white-space:normal}
.quote small{color:var(--muted)}

/* Section */
.sec-head{position:sticky;top:calc(61px + env(safe-area-inset-top));z-index:10;margin:-16px -16px 14px;padding:14px 16px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sec-head .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-head h2{margin:0;font-size:21px;color:var(--purple)}
[data-theme="dark"] .sec-head h2{color:#D9B8F5}
.sec-head .time{font-size:12.5px;color:var(--muted)}
.sec-head .cnt{font-weight:800;color:var(--orange);font-size:14px;white-space:nowrap}
.progress{height:10px;border-radius:10px;background:var(--surface-2);overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;width:0;background:var(--grad-or);border-radius:10px;transition:width .45s ease}
.actions{display:flex;gap:8px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border-radius:14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--grad-or);color:#fff;box-shadow:0 6px 16px rgba(242,138,50,.35)}
.btn.ghost{background:var(--surface);color:var(--purple);border:1px solid var(--line)}
[data-theme="dark"] .btn.ghost{color:#D9B8F5}
.btn svg.i{width:18px;height:18px}

/* Section bar (same look as bottom nav) */
.shbar{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:15;display:flex;align-items:center;gap:10px;margin:0 -6px 14px;padding:7px 8px 10px;background:var(--surface);border-radius:24px;box-shadow:0 2px 30px rgba(90,38,144,.16);border:1px solid var(--line);overflow:hidden;white-space:nowrap}
.shbar .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.shbar .ic svg.i{width:24px;height:24px}
.shbar .t{flex:1;min-width:0;line-height:1.25}
.shbar .t b{display:block;font-size:16px;color:var(--purple);overflow:hidden;text-overflow:ellipsis}
[data-theme="dark"] .shbar .t b{color:#D9B8F5}
.shbar .t small{font-size:12.5px;font-weight:800;color:var(--orange)}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.ib.primary{background:var(--grad-or);color:#fff;box-shadow:0 4px 12px rgba(242,138,50,.35)}
.ib.ghost{background:var(--surface-2);color:var(--purple)}
[data-theme="dark"] .ib.ghost{color:#D9B8F5}
.shbar .pl{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--surface-2)}
.shbar .pl i{display:block;height:100%;width:0;background:var(--grad-or);transition:width .45s ease;margin-inline-start:auto}
/* Zikr card */
.zlist{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -16px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.zlist::-webkit-scrollbar{display:none}
.zpage{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:2px 16px 6px;display:flex;min-height:0}
.zpage .zcard{flex:1;display:flex;flex-direction:column;min-height:0;transform:scale(.9);opacity:.45;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s ease,border-color .3s,background .3s}
.zpage.cur .zcard{transform:none;opacity:1}
.zpage.cur .zcard.pulse{transform:scale(.985)}
.zcard .pos{position:absolute;top:12px;right:14px;z-index:2;font-size:12px;font-weight:800;color:var(--muted);background:var(--surface-2);padding:3px 10px;border-radius:999px}
body.sec{overflow:hidden}
body.sec .app{padding-bottom:0}
body.sec main{padding-bottom:0}
body.sec .view.active{display:flex;flex-direction:column;height:calc(100dvh - 8px - env(safe-area-inset-top));padding-bottom:calc(92px + env(safe-area-inset-bottom))}
body.sec .shbar{flex:none;position:relative;top:0}
.zcard{position:relative;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);border:1.5px solid transparent;overflow:hidden;transition:border-color .3s,background .3s,transform .12s}
.zcard .tap{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;width:100%;text-align:center;padding:40px 18px 10px;user-select:none;cursor:pointer}
.zcard .tapin{margin:auto 0;padding:4px 0 8px}
.zcard.pulse{transform:scale(.985)}
.zcard .pre{font-size:13.5px;color:var(--muted);margin-bottom:6px;line-height:1.7}
.zcard .ttl{display:inline-block;font-size:12.5px;font-weight:800;color:var(--purple);background:var(--lav);padding:3px 10px;border-radius:999px;margin-bottom:8px}
[data-theme="dark"] .zcard .ttl{background:#3F3052;color:#D9B8F5}
.zcard .txt{font-family:'Cairo',sans-serif;font-weight:700;font-size:var(--zfont);line-height:1.95;white-space:pre-line;margin:0}
.zcard .txt.instr{font-family:'Cairo',sans-serif;font-weight:400;font-size:calc(var(--zfont) * .8)}
.zcard .note{display:inline-flex;margin-top:8px;font-size:12.5px;font-weight:700;color:#B85A10;background:var(--soft-or);padding:4px 10px;border-radius:10px}
[data-theme="dark"] .zcard .note{background:rgba(242,138,50,.14);color:var(--orange-l)}
.zfoot{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px 14px;border-top:1px dashed var(--line)}
.counter{position:relative;width:66px;height:66px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--soft-or);color:var(--orange);transition:transform .12s}
[data-theme="dark"] .counter{background:rgba(242,138,50,.13)}
.counter:active{transform:scale(.9)}
.counter svg.rg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.counter .rg circle{fill:none;stroke-width:5}
.counter .rg .t{stroke:rgba(242,138,50,.22)}
.counter .rg .b{stroke:var(--orange);stroke-linecap:round;transition:stroke-dashoffset .3s}
.counter b{font-size:22px;font-weight:800;line-height:1}
.counter small{position:absolute;bottom:9px;font-size:9.5px;font-weight:700;opacity:.8}
.zmeta{flex:1;min-width:0}
.zmeta .rep{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zmeta .rem{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zmeta .rem{font-size:12.5px;color:var(--muted)}
.zbtns{display:flex;gap:4px}
.zbtns button{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.zbtns button:active{background:var(--surface-2)}
.zbtns .fav.on{color:var(--orange)}
.zbtns .fav.on svg{fill:var(--orange)}
.zinfo{display:none;padding:0 18px 16px;font-size:13.5px;line-height:1.9;color:var(--muted)}
.zinfo.open{display:block;animation:fade .25s;max-height:38%;overflow-y:auto;flex:none}
.zinfo b{color:var(--purple)}
[data-theme="dark"] .zinfo b{color:#D9B8F5}
.zinfo .rv{color:#B85A10}
.zcard.done{background:linear-gradient(160deg,var(--lav),var(--surface) 70%);border-color:rgba(113,55,168,.35)}
[data-theme="dark"] .zcard.done{background:linear-gradient(160deg,#3F3052,var(--surface) 70%)}
.zcard.done .counter{background:var(--purple);color:#fff}
.zcard.done .counter .rg{display:none}
.zcard .badge{position:absolute;top:12px;left:12px;width:30px;height:30px;border-radius:50%;background:var(--grad-or);color:#fff;display:grid;place-items:center;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.zcard.done .badge{transform:scale(1)}
.badge svg.i{width:17px;height:17px;stroke-width:3}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty svg{width:64px;height:64px;color:var(--orange);opacity:.8}

/* Adhan */
.hero .nextp{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:5px 12px;border-radius:999px;background:#5A2690;color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden}
.hero .nextp b{color:var(--orange-l)}
.hero .nextp svg.i{width:16px;height:16px}

.next-card .lbl{font-size:13px;opacity:.85;font-weight:700}
.next-card .nm{font-size:30px;font-weight:800;line-height:1.3}
.next-card .tm{font-size:15px;font-weight:700;opacity:.9}
.next-card .cd{display:inline-block;margin-top:8px;padding:6px 16px;border-radius:999px;background:var(--grad-or);font-size:22px;font-weight:800;letter-spacing:.5px;direction:ltr}
.next-card .city{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;opacity:.85;margin-top:8px}
.next-card .city svg.i{width:15px;height:15px}
.loc-btn{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:700}
.loc-btn svg.i{width:16px;height:16px}
.pt-list{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.pt-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.pt-row:last-child{border-bottom:0}
.pt-row .nm{flex:1;font-weight:800;font-size:15.5px}
.pt-row .tm{font-weight:800;font-size:15.5px;color:var(--purple);min-width:72px;text-align:left}
[data-theme="dark"] .pt-row .tm{color:#D9B8F5}
.pt-row.passed{opacity:.55}
.pt-row.next{background:var(--soft-or)}
[data-theme="dark"] .pt-row.next{background:rgba(242,138,50,.12)}
.pt-row.next .nm::after{content:" · القادمة";font-size:12px;color:var(--orange)}
.pt-row .bell{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--orange);background:var(--soft-or)}
[data-theme="dark"] .pt-row .bell{background:rgba(242,138,50,.13)}
.pt-row .bell.off{color:var(--muted);background:var(--surface-2)}
.pt-row .bell.none{visibility:hidden}
.sel{font-family:inherit;font-size:15px;font-weight:700;color:var(--text);background:var(--surface-2);border:0;border-radius:12px;padding:8px 10px;max-width:52%}
.note-s{font-size:12.5px;color:var(--muted);line-height:1.8;padding:12px 16px}
/* Settings */
.set-group{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.set-row{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .ic2{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--lav);color:var(--purple);flex:none}
[data-theme="dark"] .set-row .ic2{background:#3F3052;color:#D9B8F5}
.set-row .lbl{flex:1}
.set-row .lbl b{display:block;font-size:15px}
.set-row .lbl small{color:var(--muted);font-size:12.5px}
.switch{position:relative;width:52px;height:30px;border-radius:30px;background:var(--surface-2);transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s}
.switch.on{background:var(--orange)}
.switch.on::after{transform:translateX(-22px)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--purple);color:#fff}
input[type=range]{width:100%;accent-color:var(--orange)}
.preview{font-family:'Cairo',sans-serif;font-weight:700;font-size:var(--zfont);text-align:center;padding:4px 16px 14px;line-height:1.9}
.danger{color:#C2410C}
.about{font-size:13px;color:var(--muted);line-height:1.9;padding:16px}
.about ul{padding-right:18px;margin:6px 0}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
.nav-in{display:flex;width:100%;max-width:660px;background:var(--surface);border-radius:24px;box-shadow:0 -2px 30px rgba(90,38,144,.16);padding:6px;border:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:18px;color:var(--muted);font-size:10.5px;font-weight:700;transition:color .2s,background .2s}
.nav button svg.i{width:22px;height:22px}
.nav button.on{color:#fff;background:var(--grad)}

/* Modal + toast */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(29,23,38,.55);backdrop-filter:blur(4px)}
.modal.show{display:flex}
.modal-card{position:relative;max-width:380px;width:100%;text-align:center;background:var(--surface);border-radius:28px;padding:30px 22px 22px;box-shadow:0 30px 60px rgba(0,0,0,.3);animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.modal-card .big{width:84px;height:84px;margin:-70px auto 10px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;border:6px solid var(--surface)}
.modal-card .big svg{width:40px;height:40px}
.modal-card h3{margin:0 0 6px;font-size:21px;color:var(--purple)}
[data-theme="dark"] .modal-card h3{color:#D9B8F5}
.modal-card p{font-family:'Cairo',sans-serif;font-weight:600;font-size:18px;line-height:1.8;margin:0 0 18px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:28px}
.confetti i{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}
.toast{position:fixed;bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);opacity:0;z-index:70;background:var(--night);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
body.sec .toast{bottom:auto;top:calc(84px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-12px)}
body.sec .toast.show{transform:translateX(-50%)}
@media (min-width:700px){ main{padding:22px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

<script>
/* حساب مواقيت الصلاة — خوارزمية فلكية قياسية (على نهج PrayTimes) */
const PrayerCalc = (() => {
  const dtr = d => d * Math.PI / 180, rtd = r => r * 180 / Math.PI;
  const sin = d => Math.sin(dtr(d)), cos = d => Math.cos(dtr(d)), tan = d => Math.tan(dtr(d));
  const asin = x => rtd(Math.asin(x)), acos = x => rtd(Math.acos(x)), atan2 = (y, x) => rtd(Math.atan2(y, x)), acot = x => rtd(Math.atan(1 / x));
  const fix = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };
  const fixAngle = a => fix(a, 360), fixHour = a => fix(a, 24);

  function julian(y, m, d) {
    if (m <= 2) { y -= 1; m += 12; }
    const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
  }
  function sunPosition(jd) {
    const D = jd - 2451545.0;
    const g = fixAngle(357.529 + 0.98560028 * D), q = fixAngle(280.459 + 0.98564736 * D);
    const L = fixAngle(q + 1.915 * sin(g) + 0.020 * sin(2 * g));
    const e = 23.439 - 0.00000036 * D;
    const RA = atan2(cos(e) * sin(L), cos(L)) / 15;
    return { decl: asin(sin(e) * sin(L)), eqt: q / 15 - fixHour(RA) };
  }

  const METHODS = {
    umm:   { name: 'أم القرى (السعودية)', fajr: 18.5, isha: { min: 90 } },
    egypt: { name: 'الهيئة المصرية العامة للمساحة', fajr: 19.5, isha: { angle: 17.5 } },
    mwl:   { name: 'رابطة العالم الإسلامي', fajr: 18, isha: { angle: 17 } },
  };

  /* returns UTC hours (may be <0 or >24) for the given local calendar date */
  function compute(y, m, d, lat, lng, methodKey, asrFactor, ramadan) {
    const M = METHODS[methodKey] || METHODS.umm;
    const jDate = julian(y, m, d) - lng / (15 * 24);
    const midDay = t => fixHour(12 - sunPosition(jDate + t).eqt);
    const angleTime = (angle, t, ccw) => {
      const decl = sunPosition(jDate + t).decl;
      const T = acos((-sin(angle) - sin(decl) * sin(lat)) / (cos(decl) * cos(lat))) / 15;
      return midDay(t) + (ccw ? -T : T);
    };
    const asrTime = (factor, t) => {
      const decl = sunPosition(jDate + t).decl;
      return angleTime(-acot(factor + tan(Math.abs(lat - decl))), t);
    };
    let t = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, sunset: 18, isha: 18 };
    for (let i = 0; i < 2; i++) {          // two refinement passes
      const p = Object.fromEntries(Object.entries(t).map(([k, v]) => [k, v / 24]));
      t = {
        fajr: angleTime(M.fajr, p.fajr, true),
        sunrise: angleTime(0.833, p.sunrise, true),
        dhuhr: midDay(p.dhuhr),
        asr: asrTime(asrFactor, p.asr),
        sunset: angleTime(0.833, p.sunset),
        isha: M.isha.angle ? angleTime(M.isha.angle, p.isha) : 18,
      };
    }
    const off = -lng / 15;                 // local solar -> UTC
    const out = {
      fajr: t.fajr + off, sunrise: t.sunrise + off, dhuhr: t.dhuhr + off,
      asr: t.asr + off, maghrib: t.sunset + off,
    };
    out.isha = M.isha.min ? out.maghrib + (M.isha.min + (ramadan && methodKey === 'umm' ? 30 : 0)) / 60 : t.isha + off;
    return out;
  }
  return { compute, METHODS };
})();

  };
  if (kind === 'm') return [...SHARED_ME, ...MORNING_ONLY, SALAT].map(pick);
  return [...SHARED_ME, ...EVENING_ONLY, SALAT].map(pick);
}

<script>
(() => {
'use strict';
const KEY = 'zakkerni_v1';
const $ = (s, r = document) => r.querySelector(s);
const clean = (s) => String(s).replace(/[\u06D6-\u06DC]/g, '').replace(/ {2,}/g, ' ').replace(/ \n/g, '\n');
const ico = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
const ar = (n) => Number(n).toLocaleString('ar-EG');
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };

/* ---------- Storage ---------- */
const defaults = () => ({ date: todayKey(), counts: {}, celebrated: {}, favs: [], settings: { theme: 'light', font: 17, sound: true, vib: true }, prayer: { city: 'auto', fallback: 'riyadh', loc: null, voice: 'ekramy', pin: true, method: '', asr: 1, on: true, per: { fajr: true, dhuhr: true, asr: true, maghrib: true, isha: true } }, played: {} });
let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch (e) { S = defaults(); }
  const d = defaults();
  S.settings = { ...d.settings, ...(S.settings || {}) };
  if (!S.v2) { if (S.settings.font === 22) S.settings.font = 19; S.v2 = 1; }
  if (!S.v3) { if (S.settings.font === 19 || S.settings.font === 22) S.settings.font = 17; S.v3 = 1; }
  S.prayer = { ...d.prayer, ...(S.prayer || {}) }; S.prayer.per = { ...d.prayer.per, ...(S.prayer.per || {}) }; S.played = S.played || {};
  if (!S.v4) { S.prayer.city = 'auto'; S.v4 = 1; }
  S.counts = S.counts || {}; S.favs = S.favs || []; S.celebrated = S.celebrated || {};
  rollDay();
}
function rollDay() {
  if (S.date !== todayKey()) { S.date = todayKey(); S.counts = {}; S.celebrated = {}; save(); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- Index ---------- */
const ALL = {};
Object.values(SECTIONS).forEach(sec => sec.items.forEach(z => { ALL[z.id] = { ...z, section: sec.key }; }));
const cnt = (id) => Math.min(S.counts[id] || 0, ALL[id].count);
const isDone = (id) => cnt(id) >= ALL[id].count;
function secStats(key) {
  const items = SECTIONS[key].items;
  const done = items.filter(z => isDone(z.id)).length;
  const reps = items.reduce((a, z) => a + z.count, 0);
  const got = items.reduce((a, z) => a + cnt(z.id), 0);
  return { done, total: items.length, pct: Math.round(got / reps * 100) };
}

/* ---------- Feedback ---------- */
let actx;
function tick(type = 'tap') {
  if (S.settings.vib) {
    try {
      if (window.AndroidBridge && AndroidBridge.vibrate) AndroidBridge.vibrate(type === 'done' ? 60 : 18);
      else if (navigator.vibrate) navigator.vibrate(type === 'done' ? [30, 40, 60] : 15);
    } catch (e) {}
  }
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const notes = type === 'done' ? [660, 880] : type === 'all' ? [523, 659, 784, 1046] : [1200];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type === 'tap' ? 'triangle' : 'sine'; o.frequency.value = f;
      const st = t + i * 0.11, dur = type === 'tap' ? 0.05 : 0.22;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(type === 'tap' ? 0.12 : 0.18, st + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
      o.connect(g).connect(actx.destination); o.start(st); o.stop(st + dur + 0.02);
    });
  } catch (e) {}
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }
function celebrate(title) {
  $('#mTitle').textContent = title;
  const c = $('#confetti'); c.innerHTML = '';
  const cols = ['#7137A8', '#F28A32', '#FFB066', '#8A4BC4', '#F1E8F8'];
  for (let i = 0; i < 40; i++) {
    const e = document.createElement('i');
    e.style.left = Math.random() * 100 + '%'; e.style.background = cols[i % cols.length];
    e.style.animationDelay = (Math.random() * 0.5) + 's'; e.style.transform = `rotate(${Math.random() * 180}deg)`;
    c.appendChild(e);
  }
  $('#modal').classList.add('show'); tick('all');
}
$('#mClose').onclick = () => $('#modal').classList.remove('show');
$('#modal').onclick = (e) => { if (e.target.id === 'modal') $('#modal').classList.remove('show'); };

/* ---------- Theme / font ---------- */
function applySettings() {
  document.documentElement.dataset.theme = S.settings.theme;
  document.documentElement.style.setProperty('--zfont', S.settings.font + 'px');
  const m = $('meta[name=theme-color]'); if (m) m.content = S.settings.theme === 'dark' ? '#1D1726' : '#7137A8';
}
$('#themeQuick').onclick = () => { S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark'; save(); applySettings(); if (current === 'settings') renderSettings(); };

/* ---------- Router ---------- */

/* shrink text until it fits on one line; wrap if it still can't */
function fitLine(el, min) {
  el.classList.remove('wrap'); el.style.fontSize = '';
  let s = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 1 && s > min) { s -= 0.5; el.style.fontSize = s + 'px'; }
  if (el.scrollWidth > el.clientWidth + 1) { el.style.fontSize = ''; el.classList.add('wrap'); }
}
window.addEventListener('resize', () => { if (current === 'home') document.querySelectorAll('#v-home .fit').forEach(el => fitLine(el, 13)); });

function bindCards(root, onChange) {
  root.querySelectorAll('.zcard').forEach(card => {
    const id = card.dataset.id, z = ALL[id];
    const inc = () => {
      if (isDone(id)) { toast('هذا الذكر مكتمل ✓'); return; }
      S.counts[id] = cnt(id) + 1; save();
      card.classList.add('pulse'); setTimeout(() => card.classList.remove('pulse'), 110);
      const nowDone = isDone(id);
      tick(nowDone ? 'done' : 'tap');
      refreshCard(card, false);
      onChange && onChange(id, nowDone);
    };
    card.querySelector('.tap').onclick = inc;
    card.querySelector('.counter').onclick = inc;
    card.querySelector('.rst').onclick = () => { delete S.counts[id]; delete S.celebrated[z.section]; save(); refreshCard(card, false); onChange && onChange(id, false); toast('تمت إعادة ضبط العداد'); };
    const sb = card.querySelector('.say'); if (sb) sb.onclick = () => playZikr(id, sb);
    card.querySelector('.info').onclick = () => card.querySelector('.zinfo').classList.toggle('open');
    card.querySelector('.fav').onclick = (e) => {
      const i = S.favs.indexOf(id);
      if (i >= 0) S.favs.splice(i, 1); else S.favs.push(id);
      save(); e.currentTarget.classList.toggle('on', i < 0);
      toast(i < 0 ? 'أُضيف إلى المفضلة' : 'أُزيل من المفضلة');
      if (current === 'favs' && i >= 0) renderFavs();
    };
  });
}
function refreshCard(card, keepInfo = true) {

  if (open) fresh.querySelector('.zinfo').classList.add('open');
  card.replaceWith(fresh);
  bindCards(wrapOne(fresh), currentOnChange);
}
function wrapOne(el) { return { querySelectorAll: () => [el] }; }

/* ---------- Horizontal pager ---------- */
function pagerHTML(items, showSection) {
  return `<div class="zlist" id="zl">${items.map((z, i) => `<div class="zpage" data-i="${i}">${cardHTML(z, showSection, `${ar(i + 1)} / ${ar(items.length)}`)}</div>`).join('')}</div>`;
}
let pagerIO;
function setupPager(root, startIndex) {
  const zl = root.querySelector('#zl'); if (!zl) return;
  const pages = [...zl.children];
  if (pagerIO) pagerIO.disconnect();
  pagerIO = new IntersectionObserver((ents) => ents.forEach(e => e.target.classList.toggle('cur', e.isIntersecting)), { root: zl, threshold: 0.6 });
  pages.forEach(p => pagerIO.observe(p));
  const p0 = pages[Math.max(0, Math.min(startIndex || 0, pages.length - 1))];
  requestAnimationFrame(() => { p0.scrollIntoView({ behavior: 'instant', inline: 'center', block: 'nearest' }); p0.classList.add('cur'); });
  if (!S.swipeHint) { S.swipeHint = 1; save(); setTimeout(() => toast('اسحب يمينًا ويسارًا للتنقل بين الأذكار'), 600); }
}
function goPage(page) { if (page) page.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); }
function curPage() { return document.querySelector('.view.active .zpage.cur'); }
document.addEventListener('keydown', (e) => {
  const p = curPage(); if (!p) return;
  if (e.key === 'ArrowLeft') goPage(p.nextElementSibling);

/* ---------- Prayer times & adhan ---------- */
const cityById = (id) => CITIES.find(c => c.id === id) || CITIES[0];
function city() {
  if (S.prayer.city !== 'auto') return cityById(S.prayer.city);
  const L = S.prayer.loc;
  if (L) return { id: 'auto', name: L.name, lat: L.lat, lng: L.lng, tz: L.tz, method: L.method, auto: true };
  const f = cityById(S.prayer.fallback || 'riyadh'); return { ...f, id: 'auto', auto: true, pending: true };
}
function distKm(a, b, c, d) { const R = 6371, r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); }
let locating = false;
function locate(manual) {
  if (!navigator.geolocation) { if (manual) toast('الجهاز لا يدعم تحديد الموقع'); return; }
  if (locating) return; locating = true; if (manual) toast('جارٍ تحديد موقعك…');
  try {
    navigator.geolocation.getCurrentPosition((pos) => {
      locating = false;
      const lat = +pos.coords.latitude.toFixed(4), lng = +pos.coords.longitude.toFixed(4);
      let near = null, best = 1e9;
      CITIES.forEach(c => { const dd = distKm(lat, lng, c.lat, c.lng); if (dd < best) { best = dd; near = c; } });
      let tz = 'UTC'; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) {}
      const method = near && best < 400 ? near.method : (tz === 'Asia/Riyadh' ? 'umm' : tz === 'Africa/Cairo' ? 'egypt' : 'mwl');
      S.prayer.loc = { lat, lng, tz, method, name: near && best < 40 ? near.name : 'موقعي الحالي', ts: Date.now() };
      S.prayer.city = 'auto'; save();
      if (manual) toast(`تم تحديد موقعك: ${S.prayer.loc.name}`);
      if (current === 'adhan') renderAdhan(); updateClock(); scheduleNative();
    }, (err) => {
      locating = false;
      if (manual) toast(err && err.code === 1 ? 'لم يُسمح بالوصول للموقع — اختر المدينة يدويًا' : 'تعذّر تحديد الموقع — اختر المدينة يدويًا');
    }, { enableHighAccuracy: false, timeout: 12000, maximumAge: manual ? 0 : 6 * 3600e3 });
  } catch (e) { locating = false; if (manual) toast('تعذّر تحديد الموقع — اختر المدينة يدويًا'); }
}
const method = () => S.prayer.method || city().method;
function cityYMD(c, addDays = 0) {
  const d = new Date(Date.now() + addDays * 864e5);
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: c.tz, year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(d).map(x => [x.type, x.value]));
  return [+p.year, +p.month, +p.day];
}
function isRamadan() { try { return new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { month: 'numeric' }).format(new Date()) === '9'; } catch (e) { return false; } }
function dayTimes(addDays = 0) {
  const c = city(), [y, m, d] = cityYMD(c, addDays);
  const h = PrayerCalc.compute(y, m, d, c.lat, c.lng, method(), S.prayer.asr, isRamadan());
  const base = Date.UTC(y, m - 1, d);
  return PRAYERS.map(p => ({ ...p, at: new Date(base + Math.round(h[p.k] * 60) * 60000), key: `${y}-${m}-${d}-${p.k}` }));
}
const fmtTime = (dt) => new Intl.DateTimeFormat('ar-EG', { timeZone: city().tz, hour: 'numeric', minute: '2-digit' }).format(dt);
function nextPrayer() {
  const now = Date.now();
  const n = dayTimes(0).find(p => p.k !== 'sunrise' && p.at > now);
  return n || dayTimes(1).find(p => p.k === 'fajr');
}
function countdown(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return [h, m, sec].map(v => String(v).padStart(2, '0')).join(':').replace(/\d/g, x => '٠١٢٣٤٥٦٧٨٩'[x]);
}
function updateClock() {
  const n = nextPrayer(); if (!n) return;
  const left = countdown(n.at - Date.now());
  const hn = $('#hnText'); if (hn) hn.innerHTML = `الصلاة القادمة: <b>${n.name}</b> ${fmtTime(n.at)} · بعد ${left}`;
  const cd = $('#pCd'); if (cd) cd.textContent = left;
  if (current === 'adhan' && $('#pName') && $('#pName').textContent !== n.name) renderAdhan();
  checkAdhan();
}
const audio = $('#adhanAudio');
const voice = () => ADHANS.find(v => v.id === S.prayer.voice) || ADHANS[0];
function setVoiceSrc() { const f = voice().file; if (!audio.src.endsWith(f)) { audio.src = f; } }
function playAdhan() {
  setVoiceSrc();
  audio.currentTime = 0;
  const pr = audio.play();
  if (pr && pr.catch) pr.catch(() => { $('#aPlay').style.display = ''; });
  syncPreviewBtn();
}
function stopAdhan() { try { NATIVE && AndroidBridge.stopAdhan(); } catch (e) {} audio.pause(); audio.currentTime = 0; $('#adhanModal').classList.remove('show'); syncPreviewBtn(); }
audio.addEventListener('ended', () => { $('#adhanModal').classList.remove('show'); syncPreviewBtn(); });
$('#aStop').onclick = stopAdhan;
$('#aPlay').onclick = () => { $('#aPlay').style.display = 'none'; playAdhan(); };
const NATIVE = !!(window.AndroidBridge && window.AndroidBridge.scheduleAdhans);
function scheduleNative() {
  if (!NATIVE) return;
  const list = [], f = voice().file;
  for (let d = 0; d < 30; d++) dayTimes(d).forEach(p => {
    if (p.k === 'sunrise') return;
    list.push({ t: p.at.getTime(), n: p.name, s: fmtTime(p.at), a: !!(S.prayer.on && p.adhan && S.prayer.per[p.k]), f });
  });
  try { AndroidBridge.scheduleAdhans(JSON.stringify(list), !!S.prayer.pin, city().name); } catch (e) {}
}
window.onNativeResume = () => { rollDay(); scheduleNative(); if (current === 'adhan') renderAdhan(); };
function checkAdhan() {
  if (NATIVE) return; // Android plays the adhan itself (works with the app closed)
  if (!S.prayer.on) return;
  const now = Date.now();
  dayTimes(0).forEach(p => {
    if (!p.adhan || !S.prayer.per[p.k] || S.played[p.key]) return;
    if (now >= p.at && now - p.at < 5 * 60000) {
      S.played = { [p.key]: 1, ...Object.fromEntries(Object.entries(S.played).slice(-12)) }; save();
      $('#aTitle').textContent = `حان الآن موعد أذان ${p.name}`;
      $('#aSub').textContent = `${city().name} · ${fmtTime(p.at)}`;
      $('#aPlay').style.display = 'none';
      $('#adhanModal').classList.add('show'); playAdhan(); tick('done');
    }
  });
}
function syncPreviewBtn() {
  const b = $('#pPrev'); if (!b) return;
  const playing = !audio.paused;
  b.innerHTML = `${ico(playing ? 'stop' : 'play')}${playing ? 'إيقاف الأذان' : 'استمع إلى الأذان'}`;
}
audio.addEventListener('play', syncPreviewBtn); audio.addEventListener('pause', syncPreviewBtn);

function renderAdhan() {
  scheduleNative();
  const v = $('#v-adhan'), c = city(), n = nextPrayer(), list = dayTimes(0), now = Date.now();
  const opts = (arr, cur) => arr.map(([val, label]) => `<option value="${val}" ${String(val) === String(cur) ? 'selected' : ''}>${label}</option>`).join('');
  v.innerHTML = `
    <div class="sec-head" style="position:static"><h2>مواقيت الصلاة</h2><div class="time">الأذان الرسمي لتطبيق ذَكِّرني</div></div>
    <div class="next-card">
      <div class="lbl">الصلاة القادمة</div>
      <div class="nm" id="pName">${n.name}</div>
      <div class="tm">${fmtTime(n.at)}</div>
      <div class="cd" id="pCd">${countdown(n.at - now)}</div>
      <div><span class="city">${ico('pin')}${c.name}${c.auto ? (c.pending ? ' · لم يُحدَّد الموقع بعد' : ' · تلقائي') : ''}</span></div>
      <button class="loc-btn" id="pLocate">${ico('pin')}تحديد موقعي الآن</button>
    </div>
    <div class="pt-list">${list.map(p => `
      <div class="pt-row ${p.at <= now ? 'passed' : ''} ${n && n.key === p.key ? 'next' : ''}">
        <div class="nm">${p.name}</div><div class="tm">${fmtTime(p.at)}</div>
        <button class="bell ${!p.adhan ? 'none' : S.prayer.per[p.k] && S.prayer.on ? '' : 'off'}" data-bell="${p.k}" aria-label="تنبيه ${p.name}">${ico(S.prayer.per[p.k] && S.prayer.on ? 'bell' : 'bell-off')}</button>
      </div>`).join('')}
    </div>
    <button class="btn primary" id="pPrev" style="width:100%;margin-bottom:12px"></button>
    <div class="set-group">
      <div class="set-row"><div class="ic2">${ico('bell')}</div><div class="lbl"><b>تشغيل الأذان تلقائيًا</b><small>عند دخول وقت كل صلاة</small></div><button class="switch ${S.prayer.on ? 'on' : ''}" id="pOn" aria-label="الأذان"></button></div>
      <div class="set-row"><div class="ic2">${ico('sound')}</div><div class="lbl"><b>صوت الأذان</b><small>${voice().note || ''}</small></div><select class="sel" id="pVoice">${opts(ADHANS.map(x => [x.id, x.name]), voice().id)}</select></div>
      ${NATIVE ? `<div class="set-row"><div class="ic2">${ico('bell')}</div><div class="lbl"><b>مواقيت الصلاة في الإشعارات</b><small>إشعار دائم بالصلاة القادمة وعدّاد تنازلي</small></div><button class="switch ${S.prayer.pin ? 'on' : ''}" id="pPin" aria-label="إشعار المواقيت"></button></div>` : ''}
      <div class="set-row"><div class="ic2">${ico('pin')}</div><div class="lbl"><b>المدينة</b></div><select class="sel" id="pCity">${opts([['auto', '📍 تلقائي حسب موقعي'], ...CITIES.map(x => [x.id, x.name])], S.prayer.city)}</select></div>
      <div class="set-row"><div class="ic2">${ico('book')}</div><div class="lbl"><b>طريقة الحساب</b></div><select class="sel" id="pMethod">${opts([['', 'تلقائي حسب المدينة'], ...Object.entries(PrayerCalc.METHODS).map(([k, m]) => [k, m.name])], S.prayer.method)}</select></div>
      <div class="set-row"><div class="ic2">${ico('sun')}</div><div class="lbl"><b>حساب العصر</b></div><select class="sel" id="pAsr">${opts([[1, 'الجمهور (المثل)'], [2, 'الحنفي (المثلين)']], S.prayer.asr)}</select></div>
      ${NATIVE && AndroidBridge.canExact && !AndroidBridge.canExact() ? `<button class="set-row" id="pExact" style="width:100%;text-align:right"><div class="ic2">${ico('bell')}</div><div class="lbl"><b class="danger">اسمح بالمنبّهات الدقيقة</b><small>ليُرفع الأذان في وقته تمامًا والتطبيق مغلق</small></div></button>` : ''}
      <div class="note-s">المواقيت محسوبة فلكيًا وقد تختلف دقيقة أو دقيقتين عن التقويم الرسمي. ${NATIVE ? 'يُرفع الأذان في وقته حتى والتطبيق مغلق، ومعه إشعار فيه زر إيقاف.' : 'يعمل الأذان التلقائي أثناء فتح التطبيق؛ وللأذان والتطبيق مغلق ثبّت نسخة الأندرويد.'}</div>
    </div>`;
  syncPreviewBtn();
  $('#pPrev').onclick = () => { if (!audio.paused) stopAdhan(); else playAdhan(); };
  v.querySelectorAll('[data-bell]').forEach(b => b.onclick = () => {
    const k = b.dataset.bell; if (!S.prayer.on) { S.prayer.on = true; } else S.prayer.per[k] = !S.prayer.per[k];
    save(); renderAdhan(); toast(S.prayer.per[k] ? 'سيُرفع الأذان لهذه الصلاة' : 'تم إيقاف الأذان لهذه الصلاة');
  });
  const ex = $('#pExact'); if (ex) ex.onclick = () => AndroidBridge.openExactAlarmSettings();
  $('#pVoice').onchange = (e) => { S.prayer.voice = e.target.value; save(); stopAdhan(); setVoiceSrc(); renderAdhan(); };
  const pp = $('#pPin'); if (pp) pp.onclick = () => { S.prayer.pin = !S.prayer.pin; save(); renderAdhan(); };
  $('#pOn').onclick = () => { S.prayer.on = !S.prayer.on; save(); renderAdhan(); };
  $('#pCity').onchange = (e) => {
    const v2 = e.target.value;
    if (v2 === 'auto') { S.prayer.city = 'auto'; save(); renderAdhan(); locate(true); return; }
    S.prayer.city = v2; S.prayer.fallback = v2; save(); renderAdhan(); toast('تم تحديث المواقيت');
  };
  const lb = $('#pLocate'); if (lb) lb.onclick = () => { S.prayer.city = 'auto'; save(); locate(true); };
  $('#pMethod').onchange = (e) => { S.prayer.method = e.target.value; save(); renderAdhan(); };
  $('#pAsr').onchange = (e) => { S.prayer.asr = +e.target.value; save(); renderAdhan(); };
}
setInterval(updateClock, 1000);

/* ---------- Boot ---------- */
load(); applySettings();
if (S.prayer.city === 'auto') setTimeout(() => locate(false), 1500);
setTimeout(scheduleNative, 800);
// installable web app (iPhone / any browser)
if (!NATIVE && 'serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
let start = (location.hash || '').slice(1); if (start === 'prefs') start = 'settings';
go(SECTIONS[start] || ['favs', 'settings', 'adhan'].includes(start) ? start : 'home', false);
try { history.replaceState({ view: current }, '', '#' + (current === 'settings' ? 'prefs' : current)); } catch (e) {}
setTimeout(() => $('#splash').classList.add('hide'), 1300);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.date !== todayKey()) { rollDay(); go(current, false); } });
})();

</script>
</body>
</html>

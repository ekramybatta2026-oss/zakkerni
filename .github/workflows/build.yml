name: Build Zakkerni

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/zakkerni.jks"
            echo "KS_FILE=$RUNNER_TEMP/zakkerni.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key secret: building with the debug key."
          fi

      - name: Build APK and AAB
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Zakkerni.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/Zakkerni.aab

      - uses: actions/upload-artifact@v4
        with:
          name: zakkerni-android
          path: out/

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

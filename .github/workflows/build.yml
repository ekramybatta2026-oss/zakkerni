name: Build Zakkerni

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform 36 (runner's preinstalled Android SDK)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" | tail -3
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/zakkerni.jks"
            echo "KS_FILE=$RUNNER_TEMP/zakkerni.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key secret: building with the debug key."
          fi

      - name: Build APK and AAB
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Zakkerni.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/Zakkerni.aab

      - uses: actions/upload-artifact@v4
        with:
          name: zakkerni-android
          path: out/

      - name: Publish release (direct download links)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ذَكِّرني ${{ github.run_number }}
          make_latest: true
          body: |
            ذَكِّرني — Zakkerni
            - Zakkerni.apk: للتثبيت المباشر على أندرويد
            - Zakkerni.aab: للرفع على Google Play
          files: |
            out/Zakkerni.apk
            out/Zakkerni.aab

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

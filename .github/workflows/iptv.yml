name: Build Ultimate IPTV

on:
  push:
    branches: [main, 'claude/**']
    paths: ['iptv/**', '.github/workflows/iptv.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iptv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (platform 36)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" | tail -2
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release key (optional)
        env:
          IPTV_KS_B64: ${{ secrets.IPTV_KS_B64 }}
        run: |
          if [ -n "$IPTV_KS_B64" ]; then
            echo "$IPTV_KS_B64" | base64 -d > "$RUNNER_TEMP/iptv-release.jks"
            echo "IPTV_KS_FILE=$RUNNER_TEMP/iptv-release.jks" >> "$GITHUB_ENV"
          else
            echo "No IPTV_KS_B64 secret: release is signed with the sideload key."
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug + release APK and AAB
        env:
          IPTV_KS_PASS: ${{ secrets.IPTV_KS_PASS }}
          IPTV_KS_ALIAS: ${{ secrets.IPTV_KS_ALIAS }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease assembleDebugAndroidTest

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/UltimateIPTV.apk || true
          cp app/build/outputs/bundle/release/app-release.aab out/UltimateIPTV.aab || true
          cp app/build/outputs/apk/debug/app-debug.apk out/UltimateIPTV-debug.apk || true
          cp -r app/build/reports out/reports || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultimate-iptv
          path: iptv/out/

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iptv-v1.0.${{ github.run_number }}
          name: Ultimate IPTV 1.0.${{ github.run_number }}
          make_latest: false
          files: |
            iptv/out/UltimateIPTV.apk
            iptv/out/UltimateIPTV.aab
